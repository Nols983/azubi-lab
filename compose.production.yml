name: azubi-lab

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  app:
    image: ${AZUBI_LAB_IMAGE:?AZUBI_LAB_IMAGE must be set}
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TZ: UTC
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_RATE_LIMIT_TRUST_PROXY: "true"
      PASSWORD_RESET_ORIGIN: ${PASSWORD_RESET_ORIGIN:?PASSWORD_RESET_ORIGIN must be set}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:?WEB_PUSH_VAPID_PUBLIC_KEY must be set}
      WEB_PUSH_VAPID_PRIVATE_KEY_FILE: /run/secrets/azubi-lab-web-push-vapid-private-key
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:?WEB_PUSH_VAPID_SUBJECT must be set}
      EVIDENCE_STORAGE_DIR: /data/evidence
      PROFILE_IMAGE_STORAGE_DIR: /data/profile-images
    secrets:
      - source: web_push_vapid_private_key
        target: azubi-lab-web-push-vapid-private-key
        uid: "1000"
        gid: "1000"
        mode: 0400
    volumes:
      - evidence-data:/data/evidence
      - profile-image-data:/data/profile-images
    expose:
      - "3000"
    networks:
      - backend
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backup:
    image: postgres:17
    profiles: ["operations"]
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/ops/backup-all.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB must be set}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      EVIDENCE_STORAGE_DIR: /data/evidence
      PROFILE_IMAGE_STORAGE_DIR: /data/profile-images
      BACKUP_DIR: /backups
      AZUBI_LAB_IMAGE: ${AZUBI_LAB_IMAGE:?AZUBI_LAB_IMAGE must be set}
    volumes:
      - evidence-data:/data/evidence:ro
      - profile-image-data:/data/profile-images:ro
      - ${BACKUP_DIR:?BACKUP_DIR must be set}:/backups
      - ./scripts/ops:/ops:ro
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  restore:
    image: postgres:17
    profiles: ["operations"]
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/ops/restore-all.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB must be set}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      EVIDENCE_STORAGE_DIR: /data/evidence
      PROFILE_IMAGE_STORAGE_DIR: /data/profile-images
      BACKUP_DIR: /backups
    volumes:
      - evidence-data:/data/evidence
      - profile-image-data:/data/profile-images
      - ${BACKUP_DIR:?BACKUP_DIR must be set}:/backups:ro
      - ./scripts/ops:/ops:ro
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  evidence-data:
  profile-image-data:

networks:
  backend:
    internal: true
  proxy:
    external: true
    name: ${PROXY_NETWORK:-azubi-lab-proxy}

secrets:
  web_push_vapid_private_key:
    file: ${WEB_PUSH_VAPID_PRIVATE_KEY_FILE:?WEB_PUSH_VAPID_PRIVATE_KEY_FILE must be set}
