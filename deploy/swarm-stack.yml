version: "3.8"

services:
  postgres:
    image: ${AZUBI_LAB_POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/azubi-lab-postgres-password
      TZ: UTC
    secrets:
      - source: postgres_password
        target: azubi-lab-postgres-password
        uid: "999"
        gid: "999"
        mode: 0400
    volumes:
      - type: bind
        source: /srv/azubi-lab/data/postgres
        target: /var/lib/postgresql/data
    networks:
      - azubi-lab-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-manager
      restart_policy:
        condition: on-failure
        delay: 5s

  app:
    image: ${AZUBI_LAB_IMAGE}
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TZ: UTC
      DATABASE_URL_FILE: /run/secrets/azubi-lab-database-url
      AUTH_SECRET_FILE: /run/secrets/azubi-lab-auth-secret
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_RATE_LIMIT_TRUST_PROXY: "true"
      PASSWORD_RESET_ORIGIN: https://${AZUBI_LAB_PUBLIC_HOST}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY}
      WEB_PUSH_VAPID_PRIVATE_KEY_FILE: /run/secrets/azubi-lab-web-push-vapid-private-key
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT}
      EVIDENCE_STORAGE_DIR: /data/evidence
      PROFILE_IMAGE_STORAGE_DIR: /data/profile-images
    secrets:
      - source: database_url
        target: azubi-lab-database-url
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: auth_secret
        target: azubi-lab-auth-secret
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: web_push_vapid_private_key
        target: azubi-lab-web-push-vapid-private-key
        uid: "1000"
        gid: "1000"
        mode: 0400
    volumes:
      - type: bind
        source: /srv/azubi-lab/data/evidence
        target: /data/evidence
      - type: bind
        source: /srv/azubi-lab/data/profile-images
        target: /data/profile-images
    networks:
      - azubi-lab-backend
      - proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    deploy:
      replicas: ${AZUBI_LAB_APP_REPLICAS:-1}
      placement:
        constraints:
          - node.hostname == swarm-manager
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
      rollback_config:
        parallelism: 1
        order: stop-first
      labels:
        - diun.enable=false
        - traefik.enable=true
        - traefik.docker.network=proxy
        - 'traefik.http.routers.azubi-lab.rule=Host(`${AZUBI_LAB_HOST}`)'
        - traefik.http.routers.azubi-lab.entrypoints=websecure
        - traefik.http.routers.azubi-lab.tls=true
        - traefik.http.routers.azubi-lab.tls.certresolver=${TRAEFIK_CERTRESOLVER}
        - traefik.http.routers.azubi-lab.service=azubi-lab
        - 'traefik.http.routers.azubi-lab-public.rule=Host(`${AZUBI_LAB_PUBLIC_HOST}`)'
        - traefik.http.routers.azubi-lab-public.entrypoints=websecure
        - traefik.http.routers.azubi-lab-public.tls=true
        - traefik.http.routers.azubi-lab-public.tls.certresolver=${TRAEFIK_PUBLIC_CERTRESOLVER}
        - traefik.http.routers.azubi-lab-public.service=azubi-lab
        - traefik.http.services.azubi-lab.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
    name: proxy
  azubi-lab-backend:
    name: azubi-lab-backend
    driver: overlay
    internal: true

secrets:
  database_url:
    external: true
    name: ${AZUBI_LAB_DATABASE_URL_SECRET}
  auth_secret:
    external: true
    name: ${AZUBI_LAB_AUTH_SECRET}
  web_push_vapid_private_key:
    external: true
    name: ${AZUBI_LAB_WEB_PUSH_VAPID_PRIVATE_KEY_SECRET}
  postgres_password:
    external: true
    name: ${AZUBI_LAB_POSTGRES_PASSWORD_SECRET}
